<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>자동화 현황 대시보드</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --blue: #2563eb;
    --blue-bg: #eff6ff;
    --green: #059669;
    --green-bg: #ecfdf5;
    --amber: #d97706;
    --amber-bg: #fffbeb;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --purple: #7c3aed;
    --purple-bg: #f5f3ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
    padding: 16px 14px 44px;
    max-width: 520px;
    margin: 0 auto;
    -webkit-text-size-adjust: 100%;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .badge-bot {
    flex: 0 0 auto;
    width: 32px; height: 32px; border-radius: 9px;
    background: var(--blue); color: #fff;
    display: grid; place-items: center; font-weight: 800; font-size: 16px;
  }
  h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .updated { font-size: 12px; color: var(--muted); }
  .updated.stale { color: var(--amber); }
  button.refresh {
    flex: 0 0 auto;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    padding: 8px 11px;
    border-radius: 10px;
    cursor: pointer;
    display: flex; align-items: center; gap: 5px;
  }
  button.refresh:active { background: #eef1f5; }
  button.refresh[disabled] { opacity: 0.6; cursor: default; }
  button.refresh .ico { display: inline-block; font-size: 13px; }
  button.refresh.loading .ico { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box {
    display: none;
    background: var(--amber-bg);
    border: 1px solid #fde68a;
    color: #92400e;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .error-box.show { display: block; }
  .error-box strong { display: block; margin-bottom: 3px; }
  .error-box code { font-size: 12px; }

  .alert-banner {
    background: var(--red-bg);
    border: 1px solid #fecaca;
    border-radius: 14px;
    padding: 13px 14px;
    margin-bottom: 14px;
  }
  .alert-title {
    font-size: 13px; font-weight: 700; color: var(--red);
    display: flex; align-items: center; gap: 6px; margin-bottom: 7px;
  }
  .alert-list { list-style: none; font-size: 13px; color: #7f1d1d; }
  .alert-list li { margin-top: 6px; padding-left: 10px; position: relative; }
  .alert-list li::before {
    content: "•"; position: absolute; left: 0; color: #f87171;
  }
  .alert-list .why { display: block; font-size: 12px; color: #9a3412; opacity: 0.9; margin-top: 1px; }

  .kpi-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 4px;
  }
  .kpi {
    background: var(--card);
    border-radius: 14px;
    padding: 13px 14px;
    border: 1px solid var(--border);
    min-width: 0;
  }
  .kpi-label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .kpi-val { font-size: 22px; font-weight: 800; margin: 4px 0 2px; letter-spacing: -0.02em; }
  .kpi-sub { font-size: 11px; color: var(--muted); line-height: 1.4; }
  .kpi.blue .kpi-val { color: var(--blue); }
  .kpi.green .kpi-val { color: var(--green); }
  .kpi.amber .kpi-val { color: var(--amber); }
  .kpi.purple .kpi-val { color: var(--purple); }

  .section-title {
    font-size: 12px; font-weight: 800; color: var(--muted);
    margin: 20px 2px 8px; letter-spacing: 0.04em;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .card-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 8px; margin-bottom: 6px;
  }
  .card-title { font-size: 14.5px; font-weight: 700; }
  .pill {
    flex: 0 0 auto;
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
    white-space: nowrap;
  }
  .pill.ok { background: var(--green-bg); color: var(--green); }
  .pill.wait { background: var(--amber-bg); color: var(--amber); }
  .pill.info { background: var(--blue-bg); color: var(--blue); }
  .pill.pause { background: #f3f4f6; color: var(--muted); }
  .card-desc { font-size: 13px; color: #374151; }
  .card-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .card-timing { font-size: 11px; color: var(--blue); font-weight: 700; margin-top: 7px; }

  .progress-wrap {
    height: 6px; background: #e5e7eb; border-radius: 999px; overflow: hidden; margin-top: 9px;
  }
  .progress-bar { height: 100%; background: var(--blue); border-radius: 999px; transition: width .3s ease; }
  .progress-bar.done { background: var(--green); }
  .progress-bar.wait { background: #d1d5db; }
  .progress-label { font-size: 11px; color: var(--muted); margin-top: 5px; text-align: right; }

  /* 일정 */
  .timeline { padding: 4px 0 2px; }
  .tl-item {
    display: grid;
    grid-template-columns: 74px 1fr;
    gap: 10px;
    position: relative;
    padding: 0 0 14px 0;
  }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-item::before {
    content: "";
    position: absolute; left: 74px; top: 8px; bottom: 0;
    width: 1px; background: var(--border);
  }
  .tl-item:last-child::before { display: none; }
  .tl-date { font-size: 12px; font-weight: 800; color: var(--text); padding-left: 0; }
  .tl-body { padding-left: 14px; position: relative; padding-bottom: 2px; }
  .tl-body::before {
    content: ""; position: absolute; left: -4px; top: 6px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--blue); box-shadow: 0 0 0 3px var(--blue-bg);
  }
  .tl-body li { list-style: none; font-size: 13px; color: #374151; }
  .tl-body li + li { margin-top: 3px; }
  .tl-item.next .tl-body::before { background: var(--red); box-shadow: 0 0 0 3px #fee2e2; }
  .tl-item.next .tl-date { color: var(--red); }

  footer {
    margin-top: 22px; text-align: center;
    font-size: 11px; color: #9ca3af; line-height: 1.6;
  }
  .skeleton {
    color: var(--muted); font-size: 13px; text-align: center; padding: 26px 0;
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="badge-bot">ㅂ</div>
      <div>
        <h1>자동화 현황 대시보드</h1>
        <div class="updated" id="updated">불러오는 중…</div>
      </div>
    </div>
    <button class="refresh" id="refreshBtn" type="button">
      <span class="ico">↻</span><span>새로고침</span>
    </button>
  </header>

  <div class="error-box" id="errorBox">
    <strong>데이터를 불러오지 못했습니다</strong>
    <span id="errorDetail">data.json 응답을 확인하지 못했습니다.</span>
  </div>

  <div id="app">
    <div class="skeleton">현황을 불러오는 중…</div>
  </div>

  <footer>
    업무·루틴 요약만 표시합니다 (개인 식별 정보 없음)<br />
    데이터: data.json · 새로고침하면 최신 값으로 갱신됩니다
  </footer>

<script>
(function () {
  "use strict";

  var app = document.getElementById("app");
  var updatedEl = document.getElementById("updated");
  var errorBox = document.getElementById("errorBox");
  var errorDetail = document.getElementById("errorDetail");
  var refreshBtn = document.getElementById("refreshBtn");

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function toneClass(t) {
    return ["ok", "wait", "info", "pause", "blue", "green", "amber", "purple"].indexOf(t) >= 0 ? t : "info";
  }

  function renderIssues(list) {
    if (!list || !list.length) return "";
    var items = list.map(function (it) {
      return '<li><strong>' + esc(it.title) + "</strong>" +
        (it.detail ? '<span class="why">' + esc(it.detail) + "</span>" : "") + "</li>";
    }).join("");
    return '<section class="alert-banner">' +
      '<div class="alert-title">⚠️ 확인 필요 이슈 (' + list.length + "건)</div>" +
      '<ul class="alert-list">' + items + "</ul></section>";
  }

  function renderKpis(list) {
    if (!list || !list.length) return "";
    var cells = list.map(function (k) {
      return '<div class="kpi ' + toneClass(k.tone) + '">' +
        '<div class="kpi-label">' + esc(k.label) + "</div>" +
        '<div class="kpi-val">' + esc(k.value) + "</div>" +
        (k.sub ? '<div class="kpi-sub">' + esc(k.sub) + "</div>" : "") +
        "</div>";
    }).join("");
    return '<section class="kpi-grid">' + cells + "</section>";
  }

  function renderSchedule(list) {
    if (!list || !list.length) return "";
    var rows = list.map(function (s, i) {
      var lis = (s.items || []).map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("");
      return '<div class="tl-item' + (i === 0 ? " next" : "") + '">' +
        '<div class="tl-date">' + esc(s.date) + "</div>" +
        '<ul class="tl-body">' + lis + "</ul></div>";
    }).join("");
    return '<div class="section-title">📅 다가오는 발표·일정</div>' +
      '<section class="card"><div class="timeline">' + rows + "</div></section>";
  }

  function renderRoutines(list) {
    if (!list || !list.length) return "";
    var cards = list.map(function (r) {
      var p = Math.max(0, Math.min(100, Number(r.progress) || 0));
      var cls = p >= 100 ? " done" : (p === 0 ? " wait" : "");
      return '<div class="card">' +
        '<div class="card-head">' +
        '<div class="card-title">' + esc(r.title) + "</div>" +
        '<span class="pill ' + toneClass(r.tone) + '">' + esc(r.badge) + "</span></div>" +
        '<div class="card-desc">' + esc(r.desc) + "</div>" +
        (r.meta ? '<div class="card-meta">' + esc(r.meta) + "</div>" : "") +
        '<div class="card-timing">' + esc(r.timing) + "</div>" +
        '<div class="progress-wrap"><div class="progress-bar' + cls + '" style="width:' + p + '%"></div></div>' +
        '<div class="progress-label">' + esc(r.progressLabel || p + "%") + "</div>" +
        "</div>";
    }).join("");
    return '<div class="section-title">🤖 매일 자동 루틴</div>' + cards;
  }

  function renderMonitoring(list) {
    if (!list || !list.length) return "";
    var cards = list.map(function (m) {
      return '<div class="card">' +
        '<div class="card-head">' +
        '<div class="card-title">' + esc(m.title) + "</div>" +
        '<span class="pill ' + toneClass(m.tone) + '">' + esc(m.badge) + "</span></div>" +
        '<div class="card-desc">' + esc(m.desc) + "</div>" +
        (m.meta ? '<div class="card-meta">' + esc(m.meta) + "</div>" : "") +
        "</div>";
    }).join("");
    return '<div class="section-title">📌 주요 진행·모니터링</div>' + cards;
  }

  function render(data) {
    app.innerHTML =
      renderIssues(data.issues) +
      renderKpis(data.kpis) +
      renderSchedule(data.schedule) +
      renderRoutines(data.routines) +
      renderMonitoring(data.monitoring);
    updatedEl.textContent = "업데이트: " + (data.updated || "시각 미상");
    updatedEl.classList.remove("stale");
    document.title = "자동화 현황 대시보드";
  }

  function load(isManual) {
    if (isManual) {
      refreshBtn.classList.add("loading");
      refreshBtn.disabled = true;
    }
    errorBox.classList.remove("show");

    var url = "./data.json?t=" + Date.now();
    fetch(url, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status + " — data.json 응답 오류");
        return res.json();
      })
      .then(function (data) {
        render(data);
        if (isManual) {
          var now = new Date();
          var hh = String(now.getHours()).padStart(2, "0");
          var mm = String(now.getMinutes()).padStart(2, "0");
          updatedEl.textContent = "업데이트: " + (data.updated || "") + " · 방금 " + hh + ":" + mm + " 새로고침";
        }
      })
      .catch(function (err) {
        if (!app.querySelector(".alert-banner")) {
          app.innerHTML = '<div class="skeleton">표시할 현황이 없습니다.</div>';
        }
        updatedEl.textContent = "업데이트 실패";
        updatedEl.classList.add("stale");
        errorDetail.textContent =
          "data.json을 불러오지 못했습니다 (" + (err && err.message ? err.message : "네트워크 오류") +
          "). 같은 폴더에 data.json이 있는지, 잠시 후 새로고침으로 다시 시도해 주세요.";
        errorBox.classList.add("show");
      })
      .then(function () {
        refreshBtn.classList.remove("loading");
        refreshBtn.disabled = false;
      });
  }

  refreshBtn.addEventListener("click", function () { load(true); });
  load(false);
})();
</script>
</body>
</html>
